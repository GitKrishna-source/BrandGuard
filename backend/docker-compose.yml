services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://brandguard:brandguard@db:5432/brandguard
      FRONTEND_ORIGIN: http://localhost:3000
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before deployment}
      AUTH_USERS_JSON: ${AUTH_USERS_JSON:?Set AUTH_USERS_JSON before deployment}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandguard
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard
    ports:
      - "5432:5432"
    volumes:
      - brandguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brandguard-postgres:
