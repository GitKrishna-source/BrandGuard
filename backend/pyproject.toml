[project]
name = "brandguard-api"
version = "0.1.0"
description = "BrandGuard brand governance API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "Pillow>=11.0,<12.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
