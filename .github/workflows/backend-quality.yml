name: Backend quality and audit reliability

on:
  push:
    paths: ['backend/**', '.github/workflows/backend-quality.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-quality.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenCV system libraries for RapidOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 $(apt-cache show libglib2.0-0t64 >/dev/null 2>&1 && echo libglib2.0-0t64 || echo libglib2.0-0)
      - run: pip install -e './backend[dev]'
      - name: Verify OCR engine initialization
        working-directory: backend
        run: python -c "from app.ocr import _get_ocr_engine; _get_ocr_engine()"
      - name: Evaluate audit reliability
        working-directory: backend
        run: python -m app.evaluation --check --output ../output/evals/audit-reliability.json
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reliability
          path: output/evals/audit-reliability.json
